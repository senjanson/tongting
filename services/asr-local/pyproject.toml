[project]
name = "tongting-asr"
version = "0.1.0"
description = "同听 Tongting 本地语音识别补充服务（仅绑定 127.0.0.1，faster-whisper）"
requires-python = ">=3.12,<3.14"
dependencies = [
  "faster-whisper>=1.2.1,<2",
  "fastapi>=0.115,<1",
  # server.py 继承了 uvicorn 的 H11Protocol 内部实现，升级前需重新验证连接保护与停止流程。
  "uvicorn>=0.53,<0.54",
  "numpy>=1.26,<3",
]

[project.scripts]
tongting-asr = "tongting_asr.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.7"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["tongting_asr", "conftest", "test_security"]
