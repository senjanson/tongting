<!doctype html>
<!-- 人工构造的 YouTube 观看页夹具（仅用于 E2E，经 context.route 提供），结构待与真实页面核对。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture - YouTube</title>
    <style>
      body {
        margin: 0;
        background: #0f0f0f;
        color: #fff;
        font-family: sans-serif;
      }
      #movie_player {
        position: relative;
        width: 640px;
        height: 360px;
        background: #000;
        overflow: hidden;
      }
      #movie_player video {
        width: 100%;
        height: 100%;
      }
      .ytp-caption-window-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .caption-window {
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 60px;
        text-align: center;
      }
      .ytp-caption-segment {
        background: rgba(8, 8, 8, 0.75);
        font-size: 20px;
      }
      .ytp-chrome-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 48px;
        background: rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <ytd-app id="app">
      <div id="movie_player" class="html5-video-player">
        <div class="html5-video-container">
          <video class="video-stream html5-main-video" preload="auto" playsinline></video>
        </div>
        <div class="ytp-caption-window-container"></div>
        <div class="ytp-chrome-bottom"></div>
      </div>
      <button id="fixture-fullscreen" type="button">fullscreen</button>
    </ytd-app>
    <script src="/tt-fixture/fake-player.js"></script>
  </body>
</html>
